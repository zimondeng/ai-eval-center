services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: kd_eval
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-23306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./docs/sql/03_demo_snapshot.sql:/docker-entrypoint-initdb.d/03_demo_snapshot.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -uroot -e \"SELECT 1\" kd_eval >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      extra_hosts:
        - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-18200}:18200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-prod}
      HOST: 0.0.0.0
      PORT: 18200
      WEB_DIST_DIR: /app/web/dist
      AUTO_INIT_DB: ${AUTO_INIT_DB:-true}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/kd_eval?charset=utf8mb4}
      JWT_SECRET: ${JWT_SECRET:-ai-eval-center-dev-jwt-secret-key-2026}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-ai-eval-center-dev-master-key-32}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123456}
      DEFAULT_ADMIN_DISPLAY_NAME: ${DEFAULT_ADMIN_DISPLAY_NAME:-系统管理员}
      DESENSITIZE_BASE_URL: ${DESENSITIZE_BASE_URL:-http://host.docker.internal:18100}
      DESENSITIZE_API_KEY: ${DESENSITIZE_API_KEY:-}
      PROXY_CANDIDATES: ${PROXY_CANDIDATES:-["http://host.docker.internal:10808","http://host.docker.internal:7897"]}
      EMRANK_API_KEY: ${EMRANK_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      EVAL_JAVA_BEARER_TOKEN: ${EVAL_JAVA_BEARER_TOKEN:-}
      ROUTING_EVAL_HARNESS_TOKEN: ${ROUTING_EVAL_HARNESS_TOKEN:-}
      TZ: Asia/Shanghai
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18200/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mysql_data:
